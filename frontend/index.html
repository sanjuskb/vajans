<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VAJANS — Tender Evaluation Dashboard</title>

    <!-- Favicons + browser-tab branding -->
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/brand/vajans-icon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/brand/vajans-icon-16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/brand/apple-touch-icon.png"
    />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Theme color used by mobile browser chrome (matches sidebar background) -->
    <meta name="theme-color" content="#0B0F1A" />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="VAJANS — Tender Evaluation Dashboard" />
    <meta
      property="og:description"
      content="AI-assisted, evidence-backed procurement evaluation for government officers."
    />
    <meta property="og:image" content="/brand/vajans-logo-512.png" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f8fafc;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
