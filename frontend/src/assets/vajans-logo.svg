<svg
  width="160"
  height="48"
  viewBox="0 0 160 48"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Dark background -->
  <rect width="160" height="48" rx="8" fill="#111827"/>

  <!-- Icon mark — 32x32 viewBox scaled to 40x40, centered vertically in 48px -->
  <g transform="translate(4, 4) scale(1.25)">
    <!-- Hexagonal outer frame — structural trust -->
    <path
      d="M16 2L27.856 8.5V21.5L16 28L4.144 21.5V8.5L16 2Z"
      stroke="#2563EB"
      stroke-width="1.5"
      fill="none"
    />
    <!-- Inner shield accent — institutional authority -->
    <path
      d="M16 7L22 10.5V17.5L16 21L10 17.5V10.5L16 7Z"
      fill="#1E3A5F"
      stroke="#2563EB"
      stroke-width="0.75"
    />
    <!-- Scale of justice centerpiece — evaluation core -->
    <line x1="16" y1="10" x2="16" y2="18" stroke="#60A5FA" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="12.5" y1="12.5" x2="19.5" y2="12.5" stroke="#60A5FA" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="12.5" cy="14.5" r="1.5" fill="#60A5FA"/>
    <circle cx="19.5" cy="14.5" r="1.5" fill="#60A5FA"/>
    <!-- Verdict tick — deterministic decision -->
    <path
      d="M14 17.5L15.5 19L18.5 16"
      stroke="#10B981"
      stroke-width="1.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- VAJANS wordmark -->
  <text
    x="56"
    y="28"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="16"
    font-weight="800"
    fill="#F9FAFB"
    letter-spacing="1.92"
  >VAJANS</text>

  <!-- Subtext -->
  <text
    x="57"
    y="40"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="9"
    fill="#6B7280"
    letter-spacing="0.72"
  >TENDER EVALUATION</text>
</svg>
