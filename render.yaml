# VAJANS — Render Blueprint
# ----------------------------------------------------------------------------
# Stack:
#   - vajans-backend  : FastAPI + Celery in one container (honcho-supervised),
#                       with a 1 GB persistent disk for uploaded PDFs and
#                       FAISS indexes.
#   - vajans-redis    : managed Redis used as the Celery broker + backend.
#   - vajans-frontend : Vite-built static SPA.
#
# Database:
#   Supabase Transaction pooler (configured in backend/app/db/session.py
#   when ENVIRONMENT=production). No DATABASE_URL needed here.
#
# Why one combined backend service?
#   Render disks cannot be shared across services. Both the web tier
#   (uploads, /inline serving) and the Celery worker (ingestion, FAISS
#   build) read & write the same data dirs, so they must co-locate.
#
# First-deploy checklist (set manually in the Render dashboard, marked
# `sync: false` below):
#   - OPENROUTER_API_KEY     : your OpenRouter API key
#   - ALLOWED_HOSTS          : JSON list with frontend URL,
#                              e.g. ["https://vajans-frontend.onrender.com"]
#   - VITE_API_BASE_URL      : backend URL + /api,
#                              e.g. https://vajans-backend.onrender.com/api
# ----------------------------------------------------------------------------

services:
  # --------------------------------------------------------------------------
  # Backend: FastAPI + Celery (one container)
  # --------------------------------------------------------------------------
  - type: web
    name: vajans-backend
    runtime: python
    rootDir: backend
    plan: starter                     # 512 MB RAM. Bump to 'standard' if OCR/embeddings OOM.
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: ./start.sh
    healthCheckPath: /api/health      # cheap liveness probe — no DB / Redis
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.3

      # Storage paths — point at the persistent disk mount.
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_LOCAL_PATH
        value: /opt/render/project/src/backend/data/storage
      - key: FAISS_INDEX_PATH
        value: /opt/render/project/src/backend/data/faiss

      # LLM / embedding config (deterministic by design — see settings.py).
      - key: LLM_MODEL
        value: openai/gpt-4o-mini
      - key: LLM_TEMPERATURE
        value: "0.0"
      - key: LLM_MAX_TOKENS
        value: "4096"
      - key: LLM_TIMEOUT_SECONDS
        value: "120"
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSIONS
        value: "1536"
      - key: CHUNK_SIZE
        value: "2400"
      - key: CHUNK_OVERLAP
        value: "200"

      # Celery — wire to the managed Redis service below.
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: vajans-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: vajans-redis
          property: connectionString

      # Logging
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: DEBUG
        value: "false"

      # Generated by Render on first deploy; rotate via dashboard if leaked.
      - key: SECRET_KEY
        generateValue: true

      # Set manually in the dashboard before first deploy.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1

      # Celery worker concurrency. Bump if you upgrade the plan.
      - key: CELERY_CONCURRENCY
        value: "2"

    disk:
      name: vajans-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1

  # --------------------------------------------------------------------------
  # Redis: Celery broker + result backend
  # --------------------------------------------------------------------------
  - type: redis
    name: vajans-redis
    plan: free                        # 25 MB. Plenty for a Celery broker.
    ipAllowList: []                   # private — only reachable from Render services
    maxmemoryPolicy: noeviction       # safe default for a job queue

  # --------------------------------------------------------------------------
  # Frontend: Vite-built static SPA
  # --------------------------------------------------------------------------
  - type: web
    name: vajans-frontend
    runtime: static
    rootDir: frontend
    buildCommand: |
      npm ci
      npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      # Backend base URL injected at build time; apiClient prepends this to
      # every request path. Default in code is "/api" (same-origin), but
      # backend and frontend live on separate Render domains, so set this
      # to the absolute backend URL, e.g.:
      #   https://vajans-backend.onrender.com/api
      - key: VITE_API_BASE_URL
        sync: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      # SPA fallback — every non-asset path returns index.html so React Router
      # can take over. Must be last.
      - type: rewrite
        source: /*
        destination: /index.html
