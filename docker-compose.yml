version: "3.9"

# ───────────────────────────────────────────────────────────────────────────
#  VAJANS — Local Development Stack
#  Starts: PostgreSQL 16, Redis 7
#  The FastAPI backend and Celery workers run outside Docker (on host / WSL)
# ───────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    container_name: vajans_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vajans
      POSTGRES_USER: vajans
      POSTGRES_PASSWORD: vajans_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vajans"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vajans_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
